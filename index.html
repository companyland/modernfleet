<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>modernfleet.sa — قريباً | Coming Soon</title>
  <meta name="description" content="modernfleet.sa — قريباً | Coming Soon">
  <meta name="theme-color" content="#060912">
  <meta property="og:title" content="modernfleet.sa — قريباً | Coming Soon">
  <meta property="og:url" content="https://modernfleet.sa">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23060912'/%3E%3Cpath d='M14 44V20l18 14 18-14v24' fill='none' stroke='%2334d399' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #060912;
      --text: #f3f6fb;
      --muted: #8b97ab;
      --line: rgba(148, 163, 184, .14);
      --green: #34d399;
      --cyan: #22d3ee;
      --blue: #3b82f6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      min-height: 100vh;
      min-height: 100svh;
      background: var(--bg);
      color: var(--text);
      font-family: "IBM Plex Sans Arabic", "Inter", system-ui, sans-serif;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ---------- Background: glow + routes map ---------- */
    .glow {
      position: fixed;
      inset: -20%;
      background:
        radial-gradient(38% 32% at 50% 48%, rgba(34, 211, 238, .16), transparent 70%),
        radial-gradient(30% 30% at 22% 80%, rgba(52, 211, 153, .12), transparent 70%),
        radial-gradient(30% 30% at 82% 18%, rgba(59, 130, 246, .14), transparent 70%);
      filter: blur(20px);
      animation: breathe 12s ease-in-out infinite alternate;
      pointer-events: none;
    }
    @keyframes breathe {
      from { transform: scale(1) translate3d(0, 0, 0); }
      to   { transform: scale(1.08) translate3d(-1.5%, 1%, 0); }
    }
    .map {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      mask-image: radial-gradient(ellipse 75% 70% at 50% 50%, #000 35%, transparent 85%);
      -webkit-mask-image: radial-gradient(ellipse 75% 70% at 50% 50%, #000 35%, transparent 85%);
    }
    .map .route { fill: none; stroke: var(--line); stroke-width: 1.2; }
    .map .route.dash { stroke-dasharray: 2 8; stroke: rgba(148, 163, 184, .22); }
    .map .node { fill: #0f172a; stroke: rgba(148, 163, 184, .35); stroke-width: 1.2; }
    .map .ping { fill: none; stroke: var(--green); stroke-width: 1.2; opacity: 0; transform-box: fill-box; transform-origin: center; animation: ping 3.2s ease-out infinite; }
    .map .ping.d2 { animation-delay: 1.1s; stroke: var(--cyan); }
    .map .ping.d3 { animation-delay: 2.2s; stroke: var(--blue); }
    @keyframes ping {
      0%   { opacity: .9; transform: scale(.4); }
      100% { opacity: 0;  transform: scale(3); }
    }
    .grain {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
      background-size: 56px 56px;
      mask-image: radial-gradient(circle at 50% 50%, #000 20%, transparent 70%);
      -webkit-mask-image: radial-gradient(circle at 50% 50%, #000 20%, transparent 70%);
      pointer-events: none;
    }

    /* ---------- Content ---------- */
    .wrap {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: max(24px, env(safe-area-inset-top)) 16px max(20px, env(safe-area-inset-bottom));
    }
    header {
      display: flex;
      justify-content: center;
      direction: ltr;
    }
    .logo {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-family: "Inter", system-ui, sans-serif;
      font-weight: 600;
      font-size: .95rem;
      letter-spacing: -.01em;
      color: var(--text);
      opacity: .9;
    }
    .logo svg { width: 28px; height: 28px; }

    main {
      align-self: center;
      justify-self: center;
      text-align: center;
      max-width: 820px;
      width: 100%;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 7px 16px 7px 14px;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, .18);
      background: rgba(15, 23, 42, .55);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      font-family: "Inter", system-ui, sans-serif;
      font-size: .8rem;
      font-weight: 500;
      color: var(--muted);
      letter-spacing: .02em;
      direction: ltr;
      margin-bottom: 36px;
      opacity: 0;
      animation: rise .9s .1s cubic-bezier(.2, .7, .2, 1) forwards;
    }
    .badge .dot {
      position: relative;
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 12px var(--green);
    }
    .badge .dot::after {
      content: "";
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      border: 1px solid var(--green);
      animation: pulse 2s ease-out infinite;
    }
    @keyframes pulse {
      from { transform: scale(.6); opacity: 1; }
      to   { transform: scale(1.8); opacity: 0; }
    }

    .ar {
      font-weight: 700;
      font-size: clamp(4rem, 17vw, 9.5rem);
      line-height: 1.4;
      padding: .12em .2em 0;
      margin-bottom: -.15em;
      letter-spacing: 0;
      background: linear-gradient(180deg, #ffffff 30%, rgba(255,255,255,.55));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      opacity: 0;
      animation: rise 1s .25s cubic-bezier(.2, .7, .2, 1) forwards;
    }
    .en {
      margin-top: 14px;
      font-family: "Inter", system-ui, sans-serif;
      font-weight: 500;
      font-size: clamp(.95rem, 3.2vw, 1.25rem);
      letter-spacing: .5em;
      padding-left: .5em;
      text-transform: uppercase;
      color: var(--muted);
      direction: ltr;
      opacity: 0;
      animation: rise 1s .4s cubic-bezier(.2, .7, .2, 1) forwards;
    }

    .domain {
      margin-top: 48px;
      display: inline-flex;
      align-items: center;
      gap: 14px;
      direction: ltr;
      opacity: 0;
      animation: rise 1s .55s cubic-bezier(.2, .7, .2, 1) forwards;
    }
    .domain .bar {
      width: clamp(28px, 8vw, 64px);
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(148, 163, 184, .5));
    }
    .domain .bar.r { transform: scaleX(-1); }
    .domain span.name {
      font-family: "Inter", system-ui, sans-serif;
      font-weight: 800;
      font-size: clamp(1.4rem, 5.2vw, 2.25rem);
      letter-spacing: -.03em;
      background: linear-gradient(90deg, #fff 0%, #fff 40%, var(--green) 50%, var(--cyan) 56%, #fff 66%, #fff 100%);
      background-size: 250% 100%;
      background-position: 100% 0;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: shimmer 6s 1.6s ease-in-out infinite;
    }
    .domain .tld { color: var(--green); -webkit-text-fill-color: var(--green); }
    @keyframes shimmer {
      0%, 30% { background-position: 100% 0; }
      70%, 100% { background-position: 0% 0; }
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); filter: blur(6px); }
      to   { opacity: 1; transform: none; filter: none; }
    }

    footer {
      text-align: center;
      font-family: "Inter", system-ui, sans-serif;
      font-size: .78rem;
      color: rgba(139, 151, 171, .65);
      direction: ltr;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; }
      .badge, .ar, .en, .domain { opacity: 1; }
      .map .vehicle { display: none; }
    }
  </style>
</head>
<body>
  <div class="glow" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>

  <!-- Fleet routes map -->
  <svg class="map" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <defs>
      <filter id="g" x="-200%" y="-200%" width="500%" height="500%">
        <feGaussianBlur stdDeviation="4" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <linearGradient id="trail" x1="0" x2="1">
        <stop offset="0" stop-color="#34d399" stop-opacity="0"/>
        <stop offset="1" stop-color="#34d399" stop-opacity=".9"/>
      </linearGradient>
    </defs>

    <path id="r1" class="route" d="M-40 640 C 220 600, 300 420, 520 430 S 860 600, 1060 520 S 1340 300, 1500 320"/>
    <path id="r2" class="route dash" d="M120 -20 C 180 200, 360 260, 420 430 S 380 760, 560 940"/>
    <path id="r3" class="route" d="M1480 760 C 1240 760, 1180 620, 1060 520 S 900 220, 980 -30"/>
    <path id="r4" class="route dash" d="M-40 220 C 200 240, 380 160, 620 210 S 980 150, 1180 240 S 1380 420, 1480 400"/>
    <path id="r5" class="route" d="M260 940 C 380 760, 640 760, 760 700 S 1120 820, 1320 940"/>

    <!-- hubs -->
    <g>
      <circle class="node" cx="520" cy="430" r="5"/>
      <circle class="ping" cx="520" cy="430" r="6"/>
      <circle class="node" cx="1060" cy="520" r="5"/>
      <circle class="ping d2" cx="1060" cy="520" r="6"/>
      <circle class="node" cx="620" cy="210" r="4"/>
      <circle class="ping d3" cx="620" cy="210" r="5"/>
      <circle class="node" cx="760" cy="700" r="4"/>
      <circle class="node" cx="1180" cy="240" r="4"/>
    </g>

    <!-- moving vehicles -->
    <g class="vehicle" filter="url(#g)">
      <circle r="3.5" fill="#34d399">
        <animateMotion dur="14s" repeatCount="indefinite" rotate="auto"><mpath href="#r1"/></animateMotion>
      </circle>
      <circle r="3" fill="#22d3ee">
        <animateMotion dur="11s" begin="-4s" repeatCount="indefinite"><mpath href="#r2"/></animateMotion>
      </circle>
      <circle r="3.5" fill="#3b82f6">
        <animateMotion dur="12s" begin="-2s" repeatCount="indefinite"><mpath href="#r3"/></animateMotion>
      </circle>
      <circle r="3" fill="#34d399">
        <animateMotion dur="18s" begin="-9s" repeatCount="indefinite"><mpath href="#r4"/></animateMotion>
      </circle>
      <circle r="3" fill="#22d3ee">
        <animateMotion dur="15s" begin="-6s" repeatCount="indefinite"><mpath href="#r5"/></animateMotion>
      </circle>
      <circle r="2.5" fill="#ffffff">
        <animateMotion dur="20s" begin="-12s" repeatCount="indefinite"><mpath href="#r1"/></animateMotion>
      </circle>
    </g>
  </svg>

  <div class="wrap">
    <header>
      <div class="logo">
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <defs>
            <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#22d3ee"/>
            </linearGradient>
          </defs>
          <rect x="1" y="1" width="62" height="62" rx="15" fill="rgba(15,23,42,.8)" stroke="rgba(148,163,184,.25)"/>
          <path d="M16 44V21l16 13 16-13v23" fill="none" stroke="url(#lg)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>modernfleet</span>
      </div>
    </header>

    <main>
      <div class="badge"><span class="dot"></span>Launching soon · نطلق قريباً</div>
      <h1 class="ar">قريباً</h1>
      <p class="en" lang="en">Coming Soon</p>
      <div class="domain">
        <span class="bar"></span>
        <span class="name">modernfleet<span class="tld">.sa</span></span>
        <span class="bar r"></span>
      </div>
    </main>

    <footer>&copy; <span id="y">2026</span> modernfleet.sa</footer>
  </div>

  <script>document.getElementById('y').textContent = new Date().getFullYear();</script>
</body>
</html>
