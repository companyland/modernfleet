<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>modernfleet.sa — قريباً | Coming Soon</title>
  <meta name="description" content="modernfleet.sa — قريباً | Coming Soon">
  <meta name="theme-color" content="#0b1220">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b1220;
      --bg-2: #111a2e;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #22c55e;
      --accent-2: #0ea5e9;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      background:
        radial-gradient(60rem 40rem at 85% -10%, rgba(14,165,233,.18), transparent 60%),
        radial-gradient(50rem 35rem at 0% 110%, rgba(34,197,94,.14), transparent 60%),
        linear-gradient(180deg, var(--bg), var(--bg-2));
      color: var(--text);
      font-family: "IBM Plex Sans Arabic", "Inter", system-ui, sans-serif;
      text-align: center;
      overflow-x: hidden;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(circle at center, #000 30%, transparent 75%);
      -webkit-mask-image: radial-gradient(circle at center, #000 30%, transparent 75%);
      pointer-events: none;
    }
    main { position: relative; max-width: 720px; width: 100%; }

    .domain {
      font-family: "Inter", system-ui, sans-serif;
      font-weight: 800;
      font-size: clamp(2.2rem, 8vw, 4.5rem);
      letter-spacing: -0.03em;
      line-height: 1.1;
      direction: ltr;
      margin-bottom: 40px;
    }
    .domain .tld {
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .road {
      position: relative;
      height: 2px;
      width: min(320px, 80%);
      margin: 0 auto 40px;
      background: rgba(255,255,255,.08);
      border-radius: 2px;
      overflow: hidden;
    }
    .road::after {
      content: "";
      position: absolute;
      top: 0; left: -40%;
      height: 100%; width: 40%;
      background: linear-gradient(90deg, transparent, var(--accent), var(--accent-2), transparent);
      animation: drive 2.6s ease-in-out infinite;
    }
    @keyframes drive { to { left: 100%; } }

    .ar {
      font-weight: 700;
      font-size: clamp(2rem, 7vw, 3.5rem);
      line-height: 1.3;
      margin-bottom: 8px;
    }
    .en {
      font-family: "Inter", system-ui, sans-serif;
      font-weight: 600;
      font-size: clamp(1rem, 3.5vw, 1.35rem);
      letter-spacing: 0.35em;
      padding-left: 0.35em;
      text-transform: uppercase;
      color: var(--muted);
      direction: ltr;
    }

    footer {
      position: fixed;
      bottom: 20px;
      left: 0; right: 0;
      font-family: "Inter", system-ui, sans-serif;
      font-size: .8rem;
      color: rgba(148,163,184,.6);
      direction: ltr;
    }

    @media (prefers-reduced-motion: reduce) {
      .road::after { animation: none; left: 30%; }
    }
  </style>
</head>
<body>
  <main>
    <h1 class="domain">modernfleet<span class="tld">.sa</span></h1>
    <div class="road" aria-hidden="true"></div>
    <p class="ar">قريباً</p>
    <p class="en" lang="en">Coming Soon</p>
  </main>
  <footer>&copy; <span id="y">2026</span> modernfleet.sa</footer>
  <script>document.getElementById('y').textContent = new Date().getFullYear();</script>
</body>
</html>
